<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Forms Admin Directory</title>
<style>
  :root {
    --navy: #1f3a5f;
    --blue: #2f6fae;
    --blue-light: #eef5fb;
    --text: #243447;
    --muted: #667085;
    --border: #d9e1ea;
    --bg: #f5f7fa;
    --white: #fff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  .page {
    max-width: 920px;
    margin: 0 auto;
    padding: 42px 20px 60px;
  }

  .header {
    margin-bottom: 24px;
  }

  .eyebrow {
    color: var(--blue);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  h1 {
    margin: 0;
    color: var(--navy);
    font-size: 30px;
    line-height: 1.2;
  }

  .intro {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 16px;
  }

  .controls {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(31, 58, 95, .05);
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
    color: var(--navy);
  }

  input, select {
    width: 100%;
    height: 46px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 0 13px;
    background: #fff;
    color: var(--text);
    font: inherit;
    outline: none;
  }

  input:focus, select:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47,111,174,.12);
  }

  .select-label {
    margin-top: 16px;
  }

  .results {
    margin-top: 22px;
  }

  .empty {
    background: var(--white);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 12px;
    margin-bottom: 12px;
  }

  .org-name {
    margin: 0;
    color: var(--navy);
    font-size: 21px;
    line-height: 1.3;
  }

  .count {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
  }

  .admins {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .admin {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    display: grid;
    place-items: center;
    flex: 0 0 40px;
    font-size: 13px;
    font-weight: 700;
  }

  .name {
    font-size: 16px;
    font-weight: 600;
  }

  .role {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .super-admin-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: #4f46e5;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .02em;
  }

  .footer {
    margin-top: 24px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 650px) {
    .page { padding: 28px 14px 45px; }
    h1 { font-size: 25px; }
    .admins { grid-template-columns: 1fr; }
    .result-header { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div class="eyebrow">Dynamic Forms</div>
    <h1>Admin Directory</h1>
    <p class="intro">Find the Dynamic Forms administrators assigned to your department or organization.</p>
  </header>

  <section class="controls">
    <label for="search">Search departments</label>
    <input id="search" type="search" placeholder="Start typing a department name..." autocomplete="off">

    <label class="select-label" for="organization">Department / Organization</label>
    <select id="organization">
      <option value="">Choose an organization...</option>
    </select>
  </section>

  <section id="results" class="results" aria-live="polite">
    <div class="empty">Select a department above to see its administrators.</div>
  </section>

  <div class="footer">Dynamic Forms Administrator Directory · Super Admin = more than 20 organizations</div>
</main>

const search = document.getElementById("search");
const organization = document.getElementById("organization");
const results = document.getElementById("results");
const organizations = Object.keys(adminData);

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function initials(person) {
  return ((person.first || "").charAt(0) + (person.last || "").charAt(0)).toUpperCase();
}

function populateOrganizations(filter = "") {
  const query = filter.trim().toLowerCase();
  const previous = organization.value;

  organization.innerHTML = '<option value="">Choose an organization...</option>';

  organizations
    .filter(org => !query || org.toLowerCase().includes(query))
    .forEach(org => {
      const option = document.createElement("option");
      option.value = org;
      option.textContent = org;
      organization.appendChild(option);
    });

  if (previous && organizations.includes(previous) &&
      (!query || previous.toLowerCase().includes(query))) {
    organization.value = previous;
  }
}

function showAdmins(org) {
  if (!org) {
    results.innerHTML = '<div class="empty">Select a department above to see its administrators.</div>';
    return;
  }

  const admins = adminData[org] || [];

  if (!admins.length) {
    results.innerHTML = '<div class="empty">No administrators were found for this organization.</div>';
    return;
  }

  // Keep regular admins first, then Super Admins at the bottom.
  const sortedAdmins = [...admins].sort((a, b) => {
    const aIsSuper = superAdmins.has(a.first + " " + a.last);
    const bIsSuper = superAdmins.has(b.first + " " + b.last);

    if (aIsSuper !== bIsSuper) return aIsSuper ? 1 : -1;

    return (a.last + " " + a.first).localeCompare(
      b.last + " " + b.first
    );
  });

  const cards = sortedAdmins.map(person => `
    <div class="admin">
      <div class="avatar">${escapeHtml(initials(person))}</div>
      <div>
        <div class="name">${escapeHtml(person.first + " " + person.last)}</div>
        <div class="role">Dynamic Forms Administrator</div>
        ${superAdmins.has(person.first + " " + person.last) ? '<div class="super-admin-badge">Super Admin</div>' : ''}
      </div>
    </div>
  `).join("");

  results.innerHTML = `
    <div class="result-header">
      <div>
        <h2 class="org-name">${escapeHtml(org)}</h2>
      </div>
      <div class="count">${admins.length} administrator${admins.length === 1 ? "" : "s"}</div>
    </div>
    <div class="admins">${cards}</div>
  `;
}

populateOrganizations();

search.addEventListener("input", () => {
  populateOrganizations(search.value);
  if (organization.value) showAdmins(organization.value);
});

organization.addEventListener("change", () => {
  showAdmins(organization.value);
});
</script>
